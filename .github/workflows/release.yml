name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.version.outputs.exists != 'true'
        run: npm ci && npm test && npm run build
      - if: steps.version.outputs.exists != 'true'
        name: Package the static site
        run: |
          v="${{ steps.version.outputs.tag }}"
          (cd dist && zip -qr "../learnrome-${v#v}-static.zip" .)
          sha256sum learnrome-*-static.zip > SHA256SUMS.txt
      - if: steps.version.outputs.exists != 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.tag }}"
          gh release create "$v" --target "$GITHUB_SHA" --title "LearnRome ${v#v}" --notes-file .github/release-notes.md learnrome-*-static.zip SHA256SUMS.txt
