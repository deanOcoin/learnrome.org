<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LearnRome">
  <!-- The app's palette, so a tab strip reads as the same object as the app:
       sea ground, bronze mark. Kept to two shapes and one letter because the
       thing has to survive being 16 pixels wide. -->
  <rect width="64" height="64" rx="13" fill="#0d1321" />
  <!-- Surveyor's registration ticks, the app's signature motif. -->
  <path
    d="M11 22V13a2 2 0 0 1 2-2h9M42 11h9a2 2 0 0 1 2 2v9M53 42v9a2 2 0 0 1-2 2h-9M22 53h-9a2 2 0 0 1-2-2v-9"
    fill="none"
    stroke="#d9a441"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.55"
  />
  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Iowan Old Style, Palatino, Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="700"
    fill="#e8e3d8"
  >R</text>
</svg>
